; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = grid.csv
SOLUTION_NAME = results

RESTART_SOLUTION = no
RESTART_SOLUTION_FILEPATH = results.csv

; Specify the solver type
KIND_SOLVER = Euler

; Specify cartesian or axisymmetric. Cartesian by default
TOPOLOGY = axisymmetric

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05                   

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = boundaries.csv

; Boundary Patches info
INFLOW = inlet, 130000, 300, 1, 0, 0.5
OUTFLOW = radial_equilibrium, 101300
LOWER_WALL = inviscid_wall
UPPER_WALL = inviscid_wall

; Initialization parameters
INIT_MACH_NUMBER = 0.5                      
INIT_TEMPERATURE = 300                   
INIT_PRESSURE = 101300                      
INIT_DIRECTION = 1, 0, 0.3                          

; CFL number
CFL = 1.2
N_ITERATIONS = 100000
RESIDUALS_DROP_CONVERGENCE = 4

SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 250

TIME_INTEGRATION_TYPE = 0

; Choose if local or global time-step method
TIME_STEP_METHOD = local

CONVECTION_SCHEME = JST

