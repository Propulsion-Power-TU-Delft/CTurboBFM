[CFD]
; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = ../../../grids/Wedge2D/Grid/grid_149x100.csv

; Name prefix in the solution
SOLUTION_NAME = results

; Specify the kind of solver
KIND_SOLVER = Euler

; Topology (2D, 3D or Axisymmetric)
TOPOLOGY = 2D

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05                   

; Boundary markers. The first value specifies the BC type for the surface i=0, while the second for i=ni-1. Same for j and k.
BOUNDARY_TYPE_I = inlet_supersonic, outlet_supersonic
BOUNDARY_TYPE_J = wall, wall
BOUNDARY_TYPE_K = wall, wall

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = ../../../grids/Wedge2D/Grid/grid_149x100_boundaries.csv

; Boundary Patches info
LEFT_PATCH = inlet_supersonic, 100000, 300, 695.4290761824674, 0.0, 0.0
RIGHT_PATCH = outlet_supersonic, 10000.0
UPPER_PATCH = inviscid_wall
LOWER_PATCH = inviscid_wall

; Initialization parameters
INIT_MACH_NUMBER = 2.0                     
INIT_TEMPERATURE = 300                   
INIT_PRESSURE = 100000                      
INIT_DIRECTION = 1, 0, 0                          

; CFL number
CFL = 0.6

; Total number of iterations
N_ITERATIONS = 100000
RESIDUALS_DROP_CONVERGENCE = 4

; Interval between solutions output
SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 250


; time integration type (0=rungekutta 4, 1=rungekutta 3)
TIME_INTEGRATION_TYPE = 0

; Choose if local or global time-step method
TIME_STEP_METHOD = local

CONVECTION_SCHEME = Roe
MUSCL_RECONSTRUCTION = yes
FLUX_LIMITER = van leer

