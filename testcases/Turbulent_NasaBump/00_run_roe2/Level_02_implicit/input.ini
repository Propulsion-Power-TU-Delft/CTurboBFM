; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = ../../CTurboBFM_Grids/Output/grid_353x161_0.csv
SOLUTION_NAME = results

RESTART_SOLUTION = no
RESTART_SOLUTION_FILEPATH = Volume_CSV/results.csv

OUTPUT_FIELDS_TYPE = secondary

; Specify the solver type
KIND_SOLVER = Euler

BOUNDARY_CONDITIONS_FILEPATH = ../../CTurboBFM_Grids/Output/grid_boundaries_353x161_0.csv
INFLOW = inlet, 104190, 302.4, 1, 0, 0
OUTFLOW = outlet, 101325
UPPER_WALL = inviscid_wall
BUMP = no_slip_wall, 0, 0, 0
SYMMETRIC_INLET = inviscid_wall
SYMMETRIC_OUTLET = inviscid_wall

; Specify cartesian or axisymmetric. Cartesian by default
TOPOLOGY = 2D

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05       
FLUID_SUTHERLAND_MU_REF = 1.716E-5
FLUID_SUTHERLAND_T_REF = 273.15
FLUID_SUTHERLAND_S = 110.4
FLUID_CP = 1006            
FLUID_PRANDTL_NUMBER = 0.708
VISCOSITY_ACTIVE = yes
TURBULENCE_ACTIVE = yes
TURBULENCE_MODEL = SA
TURBULENT_PRANDTL_NUMBER = 0.86


; Initialization parameters
INIT_MACH_NUMBER = 0.2                      
INIT_TEMPERATURE = 300                 
INIT_PRESSURE = 101325
INIT_DIRECTION = 1, 0, 0

; CFL number
CFL_START = 1.0
CFL_MAX = 50.0
CFL_RAMP_ITERATIONS = 500
IMPLICIT_UNDER_RELAXATION = 1.0
LINEAR_SOLVER_TOL = 1e-2
LINEAR_SOLVER_MAX_ITER = 20

N_ITERATIONS = 100000
RESIDUALS_DROP_CONVERGENCE = 16


SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 500

TIME_INTEGRATION_TYPE = implicit_lu_sgs
TIME_STEP_METHOD = local
CONVECTION_SCHEME = Roe
MUSCL_RECONSTRUCTION = yes
FLUX_LIMITER = van leer

