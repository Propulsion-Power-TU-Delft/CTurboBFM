[CFD]

; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = ../../../grids/CircularBump_2D/Grid/grid_124x64.csv
SOLUTION_NAME = results

RESTART_SOLUTION = no
RESTART_SOLUTION_FILEPATH = Volume_CSV/results.csv

; Specify the kind of solver
KIND_SOLVER = Euler

TOPOLOGY = 2D

; Fluid Properties
FLUID_NAME = Air
FLUID_MODEL = Real
FLUID_TABLE_FILE = fluid_table_air.lut
FLUID_TABLE_P_MIN = 30e3
FLUID_TABLE_P_MAX = 160e3
FLUID_TABLE_T_MIN = 200.0
FLUID_TABLE_T_MAX = 350.0
FLUID_TABLE_N_RHO = 250
FLUID_TABLE_N_E = 250
FLUID_TABLE_FORCE_REGENERATE = yes
STOP_ON_TABLE_OUT_OF_BOUNDS = yes

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = ../../../grids/CircularBump_2D/Grid/grid_124x64_boundaries.csv

; Boundary Patches info
INFLOW = inlet, 140513.23, 316.224, 1, 0, 0
OUTFLOW = outlet, 101300
LOWER_WALL = inviscid_wall
UPPER_WALL = inviscid_wall

; Initialization parameters
INIT_MACH_NUMBER = 0.5
INIT_TEMPERATURE = 285                   
INIT_PRESSURE = 101335                    
INIT_DIRECTION = 1, 0, 0     

; Specify the rotational axis (a vector with components)
ROTATION_AXIS = 1, 0, 0

; CFL number
CFL = 0.7

; Max number of iterations
N_ITERATIONS = 99999
RESIDUALS_DROP_CONVERGENCE = 4

SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 250

; Specify 0=RK41A, 1=RK31B
TIME_INTEGRATION_TYPE = 0

; Choose if local or global time-step method
TIME_STEP_METHOD = local

CONVECTION_SCHEME = Roe
MUSCL_RECONSTRUCTION = yes
FLUX_LIMITER = van albada
