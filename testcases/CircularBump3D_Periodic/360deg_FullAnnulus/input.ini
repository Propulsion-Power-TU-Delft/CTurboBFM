[CFD]

; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = ../../../grids/CircularBump_3D/Grid/grid_76_30_100_periodicitydeg_360.csv
SOLUTION_NAME = results

RESTART_SOLUTION = yes
RESTART_SOLUTION_FILEPATH = ../4deg_Sector/Volume_CSV/results.csv
RESTART_TYPE = axisymmetric

; Specify the kind of solver
KIND_SOLVER = Euler

TOPOLOGY = 3D

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05 

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = ../../../grids/CircularBump_3D/Grid/grid_76_30_100_periodicitydeg_360_boundaries.csv

; Boundary Patches info
INFLOW = inlet, 140513.23, 316.224, 1, 0, -0.5
OUTFLOW = radial_equilibrium, 101300
LOWER_WALL = inviscid_wall
UPPER_WALL = inviscid_wall

; boundary type, patch id, z-translation, z-rotation (degrees)
PER1 = periodic, 0, 0, 360.0 
PER2 = periodic, 1, 0, 360.0

INLET_REFERENCE_FRAME = cylindrical

; Initialization parameters
INIT_MACH_NUMBER = 0.7
INIT_TEMPERATURE = 285                   
INIT_PRESSURE = 101335                      
INIT_DIRECTION = 1, 0, 0     

; Specify the rotational axis (a vector with components)
ROTATION_AXIS = 1, 0, 0

; CFL number
CFL = 0.6
N_ITERATIONS = 99999
;RESIDUALS_DROP_CONVERGENCE = 6


SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 100

; Specify 0=RK41A (4-th order RK that favours boundary dissipation, CFL_MAX=2.58), 1=RK31B (3-rd order RK with good transient damping properties, CFL_MAX=1.53). 
TIME_INTEGRATION_TYPE = 0

; Choose if local or global time-step method
TIME_STEP_METHOD = local

CONVECTION_SCHEME = JST
MUSCL_RECONSTRUCTION = no
FLUX_LIMITER = van leer

