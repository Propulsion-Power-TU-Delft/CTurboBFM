; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = ../../../grids/Couette/Grid/grid_06_65_06.csv
SOLUTION_NAME = results

RESTART_SOLUTION = yes
RESTART_SOLUTION_FILEPATH = Volume_CSV/results.csv

OUTPUT_FIELDS_TYPE = secondary

; Specify the solver type
KIND_SOLVER = Euler



; Specify cartesian or axisymmetric. Cartesian by default
TOPOLOGY = 3D

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05       
FLUID_VISCOSITY_MODEL = Constant
FLUID_MU_CONSTANT = 1.716E-5
FLUID_CP = 1006            
FLUID_PRANDTL_NUMBER = 0.708
VISCOSITY_ACTIVE = yes

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = ../../../grids/Couette/Grid/grid_06_65_06_boundaries.csv

; Boundary Patches info
PER1 = periodic, 0, 1.0, 0
PER2 = periodic, 1, 1.0, 0
LOWER_WALL = no_slip_wall, 0, 0, 0, 0
UPPER_WALL = no_slip_wall, 0, 0, 50, 0
LATERAL_SIDE1 = inviscid_wall
LATERAL_SIDE2 = inviscid_wall

; Initialization parameters
INIT_MACH_NUMBER = 0.05                      
INIT_TEMPERATURE = 300                 
INIT_PRESSURE = 100000                      
INIT_DIRECTION = 0, 0, 1                          

; CFL number
; CFL number
CFL_START = 5.0
CFL_MAX = 10000.0
CFL_RAMP_ITERATIONS = 250
IMPLICIT_UNDER_RELAXATION = 1.0
LINEAR_SOLVER_TOL = 1e-2
LINEAR_SOLVER_MAX_ITER = 20

N_ITERATIONS = 999999
RESIDUALS_DROP_CONVERGENCE = 6


SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 1000

TIME_INTEGRATION_TYPE = implicit_lu_sgs

; Choose if local or global time-step method
TIME_STEP_METHOD = local

CONVECTION_SCHEME = Roe
MUSCL_RECONSTRUCTION = no
FLUX_LIMITER = van albada

