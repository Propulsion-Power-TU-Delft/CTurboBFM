[CFD]

; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = ../../../grids/SodTest_1D/Grid/grid_250_OnlyCoords.csv
SOLUTION_NAME = results_250_roe2

RESTART_SOLUTION = yes
RESTART_SOLUTION_FILEPATH = ../../../grids/SodTest_1D/Grid/grid_250_RestartData.csv

; Specify the kind of solver
KIND_SOLVER = Euler

TOPOLOGY = 1D

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05 


; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = ../../../grids/SodTest_1D/Grid/grid_250_boundaries.csv

; Boundary Patches info
LEFT_END = transparent
RIGHT_END = transparent

; CFL number
CFL = 0.8

; Max number of iterations
N_ITERATIONS = 2500
RESIDUALS_DROP_CONVERGENCE = 16


SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 250

; Specify 0=RK41A (4-th order RK that favours boundary dissipation, CFL_MAX=2.58), 1=RK31B (3-rd order RK with good transient damping properties, CFL_MAX=1.53). 
TIME_INTEGRATION_TYPE = 0

; Choose if local or global time-step method
TIME_STEP_METHOD = fixed
FIXED_TIME_STEP = 0.0001

CONVECTION_SCHEME = Roe
MUSCL_RECONSTRUCTION = yes
FLUX_LIMITER = van leer

