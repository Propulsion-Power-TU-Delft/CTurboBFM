[CFD]
; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = CTurboBFM_Mesh_118_35.csv

; Solutions info
RESTART_SOLUTION = no
RESTART_SOLUTION_FILEPATH = Volume_CSV/results.csv
SOLUTION_NAME = results


; Specify if you want to use the blockage terms or no
BFM_ACTIVE = yes
BLOCKAGE_ACTIVE = yes
BFM_MODEL = Hall-Thollet

HALL_THOLLET_COEFFICIENT_KN = 1.0
HALL_THOLLET_COEFFICIENT_KF = 1.0
HALL_THOLLET_COEFFICIENT_KD = 1.0
HALL_THOLLET_OFF_DESIGN_ACTIVE = no

; Specify the kind of solver
KIND_SOLVER = Euler

; Domain topology
TOPOLOGY = axisymmetric

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05 
FLUID_KINEMATIC_VISCOSITY = 1.48E-5                  

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = CTurboBFM_Mesh_118_35_boundaries.csv

; Boundary Patches info
INFLOW = inlet, 101325, 288.15, 1, 0, 0
OUTFLOW = throttle, 8000
LOWER_WALL = inviscid_wall
UPPER_WALL = inviscid_wall



; Specify how many iterations over which ramping up the outlet pressure
OUTLET_PRESSURE_RAMP_ITERATIONS = 5000

; Initialization parameters
INIT_MACH_NUMBER = 0.5                      
INIT_TEMPERATURE = 288.15                   
INIT_PRESSURE = 105000                   
INIT_DIRECTION = adaptive    

ROTATION_AXIS = 1, 0, 0

; CFL number
CFL = 0.75
N_ITERATIONS = 100000

SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 250
RESIDUALS_DROP_CONVERGENCE = 8


; Specify if to store data in the output related to turbo performance
TURBO_OUTPUT = yes

; Specify 0=RK41A (4-th order RK that favours boundary dissipation, CFL_MAX=2.58), 1=RK31B (3-rd order RK with good transient damping properties, CFL_MAX=1.53). 
TIME_INTEGRATION_TYPE = 0

; Choose if local or global time-step method
TIME_STEP_METHOD = local

CONVECTION_SCHEME = Roe
MUSCL_RECONSTRUCTION = no

