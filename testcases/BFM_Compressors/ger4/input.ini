[CFD]
; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = CTurboBFM_Mesh_90_46.csv
SOLUTION_NAME = results

RESTART_SOLUTION = no
RESTART_SOLUTION_FILEPATH = Volume_CSV/results.csv

OUTPUT_FIELDS_TYPE = turbo_bfm

; Specify if you want to use the blockage terms or no
BFM_ACTIVE = yes
BLOCKAGE_ACTIVE = yes
BFM_MODEL = Hall-Thollet

HALL_THOLLET_COEFFICIENT_KN = 1.0
HALL_THOLLET_COEFFICIENT_KF = 1.0
HALL_THOLLET_COEFFICIENT_KD = 1.0
HALL_THOLLET_OFF_DESIGN_ACTIVE = no

; Specify the kind of solver
KIND_SOLVER = Euler

TOPOLOGY = axisymmetric

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05 
FLUID_KINEMATIC_VISCOSITY = 1.48E-5                  

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = CTurboBFM_Mesh_90_46_boundaries.csv

; Boundary Patches info
INFLOW = inlet, 101300, 288.15, 1, 0, 0
OUTFLOW = radial_equilibrium, 97000
LOWER_WALL = inviscid_wall
UPPER_WALL = inviscid_wall

; Initialization parameters
INIT_MACH_NUMBER = 0.45                      
INIT_TEMPERATURE = 288.15                   
INIT_PRESSURE = 101325                      
INIT_DIRECTION = 1, 0, 0     

; Specify the rotational axis (a vector with components)
ROTATION_AXIS = 1, 0, 0

; CFL number
CFL_START = 0.5
CFL_MAX = 50.0
CFL_RAMP_ITERATIONS = 2000
IMPLICIT_UNDER_RELAXATION = 1.0
LINEAR_SOLVER_TOL = 1e-3
LINEAR_SOLVER_MAX_ITER = 20

N_ITERATIONS = 100000
RESIDUALS_DROP_CONVERGENCE = 4


SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 500

TIME_INTEGRATION_TYPE = implicit_lu_sgs

; Choose if local or global time-step method
TIME_STEP_METHOD = local

CONVECTION_SCHEME = Roe


