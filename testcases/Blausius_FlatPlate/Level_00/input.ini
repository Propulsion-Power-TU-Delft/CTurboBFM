; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = ../../../grids/Flat_Plate_Viscous/Level_00/Grid/grid_37x37.csv
SOLUTION_NAME = results

RESTART_SOLUTION = no
RESTART_SOLUTION_FILEPATH = Volume_CSV/results.csv

OUTPUT_FIELDS_TYPE = secondary

; Specify the solver type
KIND_SOLVER = Euler

; Specify cartesian or axisymmetric. Cartesian by default
TOPOLOGY = 2D

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05       
FLUID_SUTHERLAND_MU_REF = 1.716E-5
FLUID_SUTHERLAND_T_REF = 273.15
FLUID_SUTHERLAND_S = 110.4
FLUID_CP = 1006            
FLUID_PRANDTL_NUMBER = 0.708
VISCOSITY_ACTIVE = yes
TURBULENCE_ACTIVE = yes
TURBULENCE_MODEL = None

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = ../../../grids/Flat_Plate_Viscous/Level_00/Grid/grid_37x37_boundaries.csv

; Boundary Patches info
INFLOW = inlet, 104165, 290.304, 1, 0, 0
OUTFLOW = outlet, 101300
UPPER_WALL = outlet, 101300
LOWER_WALL = no_slip_wall, 0, 0, 0, 0

; Initialization parameters
INIT_MACH_NUMBER = 0.2                      
INIT_TEMPERATURE = 290.304                   
INIT_PRESSURE = 101300                      
INIT_DIRECTION = 1, 0, 0                          

; CFL number
CFL = 1.3
N_ITERATIONS = 500000
RESIDUALS_DROP_CONVERGENCE = 12


SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 500

TIME_INTEGRATION_TYPE = 0

; Choose if local or global time-step method
TIME_STEP_METHOD = local

CONVECTION_SCHEME = JST

