; Specify the path to the pickle object storing the coordinates of the grid points
GRID_FILE = ../../grids/Channel_2D/Grid/grid_128_128.csv
SOLUTION_NAME = results

RESTART_SOLUTION = no
RESTART_SOLUTION_FILEPATH = results.csv

; Specify the solver type
KIND_SOLVER = Euler

; Specify cartesian or axisymmetric. Cartesian by default
TOPOLOGY = axisymmetric

; Fluid Properties
FLUID_GAMMA = 1.4
FLUID_NAME = Air
FLUID_MODEL = Ideal
FLUID_R_CONSTANT = 287.05                   

; Boundary condition file
BOUNDARY_CONDITIONS_FILEPATH = ../../grids/Channel_2D/Grid/grid_128x128_boundaries.csv

; Boundary Patches info
INFLOW = inlet, 160000, 300, 1, 0, 0.5
OUTFLOW = radial_equilibrium, 101300
LOWER_WALL = inviscid_wall
UPPER_WALL = inviscid_wall

; Initialization parameters
INIT_MACH_NUMBER = 0.7                      
INIT_TEMPERATURE = 300                   
INIT_PRESSURE = 101300                      
INIT_DIRECTION = 1, 0, 0.7                          

; CFL number
CFL_START = 0.5
CFL_MAX = 5.0
CFL_RAMP_ITERATIONS = 500
IMPLICIT_UNDER_RELAXATION = 1.0
LINEAR_SOLVER_TOL = 1e-2
LINEAR_SOLVER_MAX_ITER = 20

N_ITERATIONS = 100000
RESIDUALS_DROP_CONVERGENCE = 8


SAVE_UNSTEADY = no
SAVE_ITERATIONS_INTERVAL = 500

TIME_INTEGRATION_TYPE = implicit_lu_sgs
TIME_STEP_METHOD = local
CONVECTION_SCHEME = JST
MUSCL_RECONSTRUCTION = no
FLUX_LIMITER = van leer